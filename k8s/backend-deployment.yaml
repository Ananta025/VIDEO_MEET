apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-meet-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-meet-backend
  template:
    metadata:
      labels:
        app: video-meet-backend
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: backend
          image: 851725228571.dkr.ecr.ap-south-1.amazonaws.com/video-meet-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: MONGO_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
