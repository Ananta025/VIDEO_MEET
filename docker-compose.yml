# ============================================
# Docker Compose - Local Development Setup
# Run: docker-compose up --build
# ============================================

version: '3.8'

services:
  # ==================== Backend ====================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: videomeet-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./Backend/.env
    environment:
      # Server config
      - PORT=3001
      - NODE_ENV=production
      # MongoDB - replace with your MongoDB Atlas URI or local MongoDB
      - MONGO_URL=${MONGO_URL:-mongodb://host.docker.internal:27017/videomeet}
      # JWT Secret - CHANGE IN PRODUCTION
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      # CORS - Frontend URL
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      # OpenAI (optional, for transcription)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Persist uploads
      - backend-uploads:/app/uploads
      - backend-temp:/app/temp
    networks:
      - videomeet-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==================== Frontend ====================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        # Backend URL - accessible from browser
        VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:3001}
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3001}
    container_name: videomeet-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - videomeet-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

# ==================== Networks ====================
networks:
  videomeet-network:
    driver: bridge

# ==================== Volumes ====================
volumes:
  backend-uploads:
    driver: local
  backend-temp:
    driver: local
